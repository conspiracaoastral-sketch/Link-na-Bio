[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/youtube"
  to = "/.netlify/functions/youtube"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
